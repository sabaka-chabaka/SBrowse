name: CI

on:
  push: 
    branches: [ master ]
  pull_request:
    branches: [ master ]
    
jobs: 
  tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install dotnet
        uses: actions/setup-dotnet@v6
        
      - name: Install dependencies
        run: dotnet restore
        
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Tests
        run: dotnet test --no-restore --no-build